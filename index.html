<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ponto Biométrico - Versão Funcional</title>

    <!-- FaceAPI.js via CDN - Mais estável -->
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js">
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 550px;
            width: 100%;
            background: #1e293b;
            border-radius: 16px;
            padding: 24px;
            border: 1px solid #334155;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .header h1 {
            font-size: 20px;
            background: linear-gradient(135deg, #34d399, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .clock {
            font-size: 14px;
            color: #94a3b8;
            background: #0f172a;
            padding: 6px 14px;
            border-radius: 10px;
            border: 1px solid #334155;
        }

        .camera-box {
            position: relative;
            width: 100%;
            aspect-ratio: 4/3;
            background: #020617;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #334155;
            margin-bottom: 12px;
        }

        .camera-box.active {
            border-color: #10b981;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        .status-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 12px;
            background: rgba(0, 0, 0, 0.7);
            text-align: center;
            font-size: 14px;
            font-weight: 600;
        }

        .status-overlay.waiting {
            color: #94a3b8;
        }
        .status-overlay.found {
            color: #34d399;
        }
        .status-overlay.registered {
            color: #f59e0b;
        }
        .status-overlay.not-found {
            color: #f43f5e;
        }

        .match-info {
            display: flex;
            align-items: center;
            gap: 16px;
            background: #0f172a;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid #334155;
            margin-bottom: 12px;
            min-height: 70px;
        }

        .match-info .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #334155;
            background: #1e293b;
            flex-shrink: 0;
        }

        .match-info .avatar.found {
            border-color: #10b981;
        }
        .match-info .avatar.registered {
            border-color: #f59e0b;
        }
        .match-info .avatar.not-found {
            border-color: #f43f5e;
        }

        .match-info .details {
            flex: 1;
        }

        .match-info .name {
            font-weight: 700;
            font-size: 16px;
        }

        .match-info .name.found {
            color: #34d399;
        }
        .match-info .name.registered {
            color: #f59e0b;
        }
        .match-info .name.not-found {
            color: #f43f5e;
        }

        .match-info .sub {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 2px;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
            min-width: 80px;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-primary {
            background: linear-gradient(135deg, #10b981, #06b6d4);
            color: #020617;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #334155;
            color: #f8fafc;
        }

        .btn-secondary:hover {
            background: #475569;
        }

        .btn-danger {
            background: #f43f5e;
            color: white;
        }

        .btn-danger:hover {
            background: #e11d48;
        }

        .btn-success {
            background: #10b981;
            color: #020617;
        }

        .btn-success:hover {
            background: #059669;
        }

        .admin-panel {
            display: none;
            margin-top: 16px;
            padding: 16px;
            background: #0f172a;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .admin-panel.open {
            display: block;
        }

        .admin-panel h3 {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 12px;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
        }

        .input-group {
            margin-bottom: 10px;
        }

        .input-group label {
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: block;
            margin-bottom: 4px;
        }

        .input-group input,
        .input-group select {
            width: 100%;
            padding: 10px 14px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #f8fafc;
            font-size: 14px;
            outline: none;
        }

        .input-group input:focus,
        .input-group select:focus {
            border-color: #10b981;
        }

        .log-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            margin-top: 10px;
        }

        .log-table th,
        .log-table td {
            padding: 8px 10px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }

        .log-table th {
            color: #94a3b8;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .log-table .photo-preview {
            width: 35px;
            height: 28px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid #334155;
        }

        .log-table .empty {
            text-align: center;
            color: #475569;
            padding: 20px;
            font-style: italic;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 14px 20px;
            border-radius: 12px;
            color: white;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.3s ease;
            max-width: 350px;
            z-index: 999;
        }

        .toast-success {
            background: #10b981;
        }
        .toast-error {
            background: #f43f5e;
        }
        .toast-warning {
            background: #f59e0b;
            color: #333;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loading {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 16px;
        }

        .loading.active {
            display: flex;
        }

        .loading .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #334155;
            border-top: 4px solid #10b981;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .loading p {
            color: #94a3b8;
            font-size: 14px;
        }

        .menu-trigger {
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 8px;
            transition: all 0.3s;
            user-select: none;
        }

        .menu-trigger:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .menu-trigger .badge-admin {
            font-size: 10px;
            color: #f43f5e;
            background: rgba(244, 63, 94, 0.15);
            padding: 2px 10px;
            border-radius: 12px;
            margin-left: 6px;
        }

        .btn-sm {
            padding: 6px 14px;
            font-size: 12px;
            flex: none;
        }

        @media (max-width: 480px) {
            .container {
                padding: 16px;
            }
            .btn-group {
                flex-direction: column;
            }
            .btn {
                flex: none;
                width: 100%;
            }
            .match-info {
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>

    <!-- LOADING -->
    <div class="loading active" id="loading">
        <div class="spinner"></div>
        <p>🧠 Carregando IA de Reconhecimento Facial...</p>
    </div>

    <div class="container">

        <!-- HEADER -->
        <div class="header">
            <div class="menu-trigger" id="admTrigger" title="Clique 3 vezes para ADM">
                <span style="font-weight:700;font-size:18px;">🔐 PONTO</span>
                <span class="badge-admin">ADM</span>
            </div>
            <div class="clock" id="clock">00:00:00</div>
        </div>

        <!-- CÂMERA -->
        <div class="camera-box" id="cameraBox">
            <video id="video" autoplay playsinline muted></video>
            <div class="status-overlay waiting" id="statusOverlay">📷 Posicione o rosto na câmera</div>
        </div>

        <!-- INFORMAÇÕES DO MATCH -->
        <div class="match-info" id="matchInfo">
            <img id="avatar" class="avatar" src="data:image/svg+xml;utf8,<svg xmlns='http://w3.org' viewBox='0 0 24 24' fill='%23475569'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5-4-8-4z'/></svg>">
            <div class="details">
                <div class="name" id="matchName">Aguardando...</div>
                <div class="sub" id="matchSub">Posicione o rosto na câmera</div>
            </div>
        </div>

        <!-- BOTÕES -->
        <div class="btn-group">
            <button class="btn btn-primary" id="btnRegister" disabled>✅ Registrar Ponto</button>
            <button class="btn btn-secondary" onclick="toggleAdmin()">🔒 ADM</button>
            <button class="btn btn-secondary" onclick="exportarPDF()">📄 PDF</button>
        </div>

        <!-- PAINEL ADMIN -->
        <div class="admin-panel" id="adminPanel">
            <h3>🔒 PAINEL ADMINISTRATIVO</h3>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                <div class="input-group">
                    <label>👤 Nome</label>
                    <input type="text" id="newName" placeholder="Nome do colaborador">
                </div>
                <div class="input-group">
                    <label>🆔 Matrícula</label>
                    <input type="text" id="newId" placeholder="Ex: MAT-001">
                </div>
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                <div class="input-group">
                    <label>📋 Departamento</label>
                    <select id="newDept">
                        <option value="Operações">Operações</option>
                        <option value="Administração">Administração</option>
                        <option value="Produção">Produção</option>
                        <option value="Logística">Logística</option>
                        <option value="TI">TI</option>
                        <option value="Transporte">Transporte</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>📅 Turno</label>
                    <select id="newTurno">
                        <option value="Matutino">Matutino (06h-14h)</option>
                        <option value="Vespertino">Vespertino (14h-22h)</option>
                        <option value="Noturno">Noturno (22h-06h)</option>
                        <option value="Comercial">Comercial (08h-18h)</option>
                    </select>
                </div>
            </div>

            <button class="btn btn-success" onclick="cadastrarBiometria()" style="width:100%;margin-bottom:12px;">
                💾 Salvar Biometria
            </button>

            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">
                <button class="btn btn-secondary btn-sm" onclick="exportarPDF()">📄 PDF</button>
                <button class="btn btn-danger btn-sm" onclick="limparHistorico()">🗑️ Limpar Histórico</button>
            </div>

            <h3 style="margin-top:12px;">📋 Histórico de Batidas</h3>
            <div style="overflow-x:auto;">
                <table class="log-table">
                    <thead>
                        <tr><th>Foto</th><th>Nome</th><th>Matrícula</th><th>Data/Hora</th></tr>
                    </thead>
                    <tbody id="logBody">
                        <tr><td colspan="4" class="empty">📭 Nenhum registro</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        // ============================================
        // VARIÁVEIS GLOBAIS
        // ============================================
        const video = document.getElementById('video');
        const statusOverlay = document.getElementById('statusOverlay');
        const matchInfo = document.getElementById('matchInfo');
        const avatar = document.getElementById('avatar');
        const matchName = document.getElementById('matchName');
        const matchSub = document.getElementById('matchSub');
        const btnRegister = document.getElementById('btnRegister');
        const adminPanel = document.getElementById('adminPanel');
        const admTrigger = document.getElementById('admTrigger');
        const loading = document.getElementById('loading');

        let db = null;
        let trabalhadores = [];
        let clickCount = 0;
        let trabalhadorAtivo = null;
        let isScanning = false;
        let faceapiReady = false;
        let ultimoRegistro = {};
        let rostoDetectado = false;
        let stream = null;
        let detectionInterval = null;

        // ============================================
        // TOAST
        // ============================================
        function showToast(message, type = 'success') {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        // ============================================
        // RELÓGIO
        // ============================================
        setInterval(() => {
            document.getElementById('clock').textContent = new Date().toLocaleTimeString('pt-BR');
        }, 1000);

        // ============================================
        // ADMIN TRIGGER (3 cliques)
        // ============================================
        admTrigger.addEventListener('click', () => {
            clickCount++;
            if (clickCount === 3) {
                toggleAdmin();
                clickCount = 0;
                showToast('🔓 Painel administrativo liberado!', 'warning');
            }
            setTimeout(() => { clickCount = 0; }, 2000);
        });

        function toggleAdmin() {
            adminPanel.classList.toggle('open');
            if (adminPanel.classList.contains('open')) {
                carregarHistorico();
            }
        }

        // ============================================
        // INDEXEDDB
        // ============================================
        const request = indexedDB.open("PontoBiometricoDB", 3);

        request.onupgradeneeded = function(e) {
            const db = e.target.result;
            if (!db.objectStoreNames.contains("trabalhadores")) {
                const store = db.createObjectStore("trabalhadores", { keyPath: "id" });
                store.createIndex("nome", "nome", { unique: false });
            }
            if (!db.objectStoreNames.contains("pontos")) {
                const store = db.createObjectStore("pontos", { autoIncrement: true });
                store.createIndex("data", "data", { unique: false });
                store.createIndex("nome", "nome", { unique: false });
            }
        };

        request.onsuccess = function(e) {
            db = e.target.result;
            carregarTrabalhadores();
            carregarHistorico();
            iniciarCamera();
            carregarFaceAPI();
        };

        request.onerror = function() {
            showToast('❌ Erro ao acessar banco de dados', 'error');
        };

        // ============================================
        // CARREGAR FACEAPI
        // ============================================
        async function carregarFaceAPI() {
            try {
                loading.classList.add('active');
                const MODEL_URL = 'https://justadudewhohas.github.io/face-api.js/models';

                await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
                await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
                await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);

                faceapiReady = true;
                loading.classList.remove('active');
                showToast('🧠 IA de reconhecimento facial pronta!', 'success');
                iniciarReconhecimento();

            } catch (error) {
                loading.classList.remove('active');
                console.error('Erro FaceAPI:', error);
                showToast('⚠️ Modo simulação ativado', 'warning');
                iniciarReconhecimentoSimulado();
            }
        }

        // ============================================
        // CÂMERA
        // ============================================
        async function iniciarCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    audio: false,
                    video: {
                        facingMode: "user",
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    }
                });
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    video.play();
                    document.getElementById('cameraBox').classList.add('active');
                };
            } catch (err) {
                showToast('⚠️ Permita o acesso à câmera', 'error');
            }
        }

        // ============================================
        // RECONHECIMENTO REAL
        // ============================================
        function iniciarReconhecimento() {
            if (detectionInterval) clearInterval(detectionInterval);

            detectionInterval = setInterval(async () => {
                if (!faceapiReady || video.paused || !video.srcObject) return;

                try {
                    const detections = await faceapi.detectAllFaces(video)
                        .withFaceLandmarks()
                        .withFaceDescriptors();

                    if (detections.length > 0) {
                        rostoDetectado = true;
                        const descriptor = detections[0].descriptor;
                        await buscarMatch(descriptor);
                    } else {
                        rostoDetectado = false;
                        if (!isScanning) resetMatch();
                    }

                } catch (error) {
                    console.error('Erro:', error);
                }
            }, 1000);
        }

        // ============================================
        // BUSCAR MATCH
        // ============================================
        async function buscarMatch(descriptor) {
            if (trabalhadores.length === 0) {
                setStatus('not-found', '⚠️ Nenhum colaborador cadastrado', 'Cadastre no painel ADM');
                return;
            }

            let melhorMatch = null;
            let melhorDistancia = 0.6;

            for (const worker of trabalhadores) {
                if (!worker.descritor) continue;
                try {
                    const descritorSalvo = new Float32Array(worker.descritor);
                    const distancia = faceapi.euclideanDistance(descriptor, descritorSalvo);
                    if (distancia < melhorDistancia) {
                        melhorDistancia = distancia;
                        melhorMatch = worker;
                    }
                } catch (e) {}
            }

            if (melhorMatch) {
                const confianca = Math.round((1 - melhorDistancia) * 100);
                trabalhadorAtivo = melhorMatch;
                setStatus('found', `✅ ${melhorMatch.nome} (${confianca}%)`, `Matrícula: ${melhorMatch.id}`);

                const pode = podeRegistrar(melhorMatch.id);
                if (pode.pode) {
                    btnRegister.disabled = false;
                } else {
                    setStatus('registered', `⏳ ${melhorMatch.nome} já registrou`, `Próximo em ${pode.tempoRestante} minuto(s)`);
                    btnRegister.disabled = true;
                }
                isScanning = true;
            } else {
                setStatus('not-found', '❌ Rosto não reconhecido', 'Tente novamente');
                btnRegister.disabled = true;
            }
        }

        // ============================================
        // RECONHECIMENTO SIMULADO (FALLBACK)
        // ============================================
        function iniciarReconhecimentoSimulado() {
            if (detectionInterval) clearInterval(detectionInterval);

            detectionInterval = setInterval(() => {
                if (video.paused || !video.srcObject || trabalhadores.length === 0) {
                    resetMatch();
                    return;
                }

                const hasFace = Math.random() > 0.4;

                if (hasFace) {
                    rostoDetectado = true;
                    const random = trabalhadores[Math.floor(Math.random() * trabalhadores.length)];
                    if (random) {
                        trabalhadorAtivo = random;
                        setStatus('found', `✅ ${random.nome}`, `Matrícula: ${random.id}`);

                        const pode = podeRegistrar(random.id);
                        if (pode.pode) {
                            btnRegister.disabled = false;
                        } else {
                            setStatus('registered', `⏳ ${random.nome} já registrou`, `Próximo em ${pode.tempoRestante} minuto(s)`);
                            btnRegister.disabled = true;
                        }
                        isScanning = true;
                    }
                } else {
                    rostoDetectado = false;
                    if (!isScanning) resetMatch();
                }
            }, 1500);
        }

        // ============================================
        // SET STATUS
        // ============================================
        function setStatus(type, name, sub) {
            const classes = {
                'found': 'found',
                'registered': 'registered',
                'not-found': 'not-found',
                'waiting': 'waiting'
            };

            const overlayClass = classes[type] || 'waiting';
            statusOverlay.className = `status-overlay ${overlayClass}`;
            statusOverlay.textContent = name;

            matchName.className = `name ${overlayClass}`;
            matchName.textContent = name;

            avatar.className = `avatar ${overlayClass}`;

            matchSub.textContent = sub || '';
        }

        // ============================================
        // RESET MATCH
        // ============================================
        function resetMatch() {
            setStatus('waiting', 'Aguardando...', 'Posicione o rosto na câmera');
            avatar.src = "data:image/svg+xml;utf8,<svg xmlns='http://w3.org' viewBox='0 0 24 24' fill='%23475569'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5-4-8-4z'/></svg>";
            btnRegister.disabled = true;
            isScanning = false;
            trabalhadorAtivo = null;
        }

        // ============================================
        // VERIFICAR REGISTRO
        // ============================================
        function podeRegistrar(id) {
            const intervalo = 5; // 5 minutos
            const agora = Date.now();
            const ultimo = ultimoRegistro[id] || 0;
            const diff = (agora - ultimo) / (1000 * 60);

            if (diff < intervalo) {
                return { pode: false, tempoRestante: Math.ceil(intervalo - diff) };
            }
            return { pode: true, tempoRestante: 0 };
        }

        // ============================================
        // REGISTRAR PONTO
        // ============================================
        btnRegister.addEventListener('click', () => {
            if (!trabalhadorAtivo || !rostoDetectado) {
                showToast('⚠️ Nenhum rosto reconhecido!', 'error');
                return;
            }

            const canvas = document.createElement('canvas');
            canvas.width = 320;
            canvas.height = 240;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, 320, 240);
            const foto = canvas.toDataURL('image/jpeg', 0.7);

            const horario = new Date().toLocaleString('pt-BR');

            const transaction = db.transaction(["pontos"], "readwrite");
            const store = transaction.objectStore("pontos");

            store.add({
                nome: trabalhadorAtivo.nome,
                matricula: trabalhadorAtivo.id,
                horario: horario,
                foto: foto,
                turno: trabalhadorAtivo.turno || 'N/A'
            });

            transaction.oncomplete = function() {
                ultimoRegistro[trabalhadorAtivo.id] = Date.now();
                btnRegister.disabled = true;
                setStatus('registered', `✅ Ponto registrado!`, `${trabalhadorAtivo.nome} - ${horario}`);
                showToast(`✅ Ponto registrado: ${trabalhadorAtivo.nome}`, 'success');
                carregarHistorico();
            };
        });

        // ============================================
        // CADASTRAR BIOMETRIA
        // ============================================
        async function cadastrarBiometria() {
            const name = document.getElementById('newName').value.trim();
            const id = document.getElementById('newId').value.trim();
            const dept = document.getElementById('newDept').value;
            const turno = document.getElementById('newTurno').value;

            if (!name || !id) {
                showToast('⚠️ Preencha nome e matrícula', 'error');
                return;
            }

            if (trabalhadores.some(w => w.id === id)) {
                showToast('⚠️ Matrícula já cadastrada!', 'error');
                return;
            }

            if (!rostoDetectado) {
                showToast('⚠️ Posicione um rosto na câmera!', 'error');
                return;
            }

            const canvas = document.createElement('canvas');
            canvas.width = 160;
            canvas.height = 120;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, 160, 120);
            const foto = canvas.toDataURL('image/jpeg', 0.7);

            let descritor = null;

            if (faceapiReady) {
                try {
                    const detections = await faceapi.detectSingleFace(video)
                        .withFaceLandmarks()
                        .withFaceDescriptor();
                    if (detections) {
                        descritor = Array.from(detections.descriptor);
                    }
                } catch (e) {}
            }

            const transaction = db.transaction(["trabalhadores"], "readwrite");
            const store = transaction.objectStore("trabalhadores");

            store.put({
                id: id,
                nome: name,
                foto: foto,
                descritor: descritor,
                departamento: dept,
                turno: turno,
                dataCadastro: new Date().toISOString()
            });

            transaction.oncomplete = function() {
                showToast(`✅ ${name} cadastrado com sucesso!`, 'success');
                document.getElementById('newName').value = '';
                document.getElementById('newId').value = '';
                carregarTrabalhadores();
            };
        }

        // ============================================
        // CARREGAR TRABALHADORES
        // ============================================
        function carregarTrabalhadores() {
            if (!db) return;
            const transaction = db.transaction(["trabalhadores"], "readonly");
            const store = transaction.objectStore("trabalhadores");
            const requestAll = store.getAll();

            requestAll.onsuccess = function() {
                trabalhadores = requestAll.result || [];
                console.log(`👥 ${trabalhadores.length} trabalhadores cadastrados`);
            };
        }

        // ============================================
        // CARREGAR HISTÓRICO
        // ============================================
        function carregarHistorico() {
            if (!db) return;
            const transaction = db.transaction(["pontos"], "readonly");
            const store = transaction.objectStore("pontos");
            const requestAll = store.getAll();

            requestAll.onsuccess = function() {
                const registros = requestAll.result || [];
                const tbody = document.getElementById('logBody');

                if (registros.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" class="empty">📭 Nenhum registro</td></tr>`;
                    return;
                }

                tbody.innerHTML = '';
                const sorted = registros.reverse().slice(0, 30);
                sorted.forEach(p => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td><img src="${p.foto || 'data:image/svg+xml;utf8,<svg xmlns=%22http://w3.org%22 viewBox=%220 0 24 24%22 fill=%22%23475569%22><path d=%22M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5-4-8-4z%22/></svg>'}" class="photo-preview"></td>
                        <td><strong>${p.nome || 'Desconhecido'}</strong></td>
                        <td>${p.matricula || 'N/A'}</td>
                        <td>${p.horario || 'N/A'}</td>
                    `;
                    tbody.appendChild(row);
                });
            };
        }

        // ============================================
        // LIMPAR HISTÓRICO
        // ============================================
        function limparHistorico() {
            if (!confirm('⚠️ Tem certeza?')) return;
            const transaction = db.transaction(["pontos"], "readwrite");
            const store = transaction.objectStore("pontos");
            store.clear().onsuccess = function() {
                showToast('🗑️ Histórico limpo!', 'warning');
                carregarHistorico();
                ultimoRegistro = {};
            };
        }

        // ============================================
        // EXPORTAR PDF
        // ============================================
        function exportarPDF() {
            const transaction = db.transaction(["pontos"], "readonly");
            const store = transaction.objectStore("pontos");
            const requestAll = store.getAll();

            requestAll.onsuccess = function() {
                const registros = requestAll.result;

                if (registros.length === 0) {
                    showToast('📭 Nenhum registro para exportar', 'warning');
                    return;
                }

                const janela = window.open('', '_blank');
                let html = `<!DOCTYPE html>
                <html><head><title>Relatório de Ponto</title>
                <style>
                    body{font-family:Arial;padding:30px;color:#333;}
                    .header{text-align:center;border-bottom:2px solid #111;padding-bottom:15px;margin-bottom:25px;}
                    .header h1{margin:0;font-size:22px;}
                    table{width:100%;border-collapse:collapse;margin-top:15px;}
                    th,td{border:1px solid #777;padding:10px;text-align:left;font-size:12px;}
                    th{background:#eaeaea;}
                    .photo-preview{width:40px;height:32px;object-fit:cover;border-radius:4px;}
                    .footer{margin-top:40px;text-align:center;font-size:11px;color:#777;border-top:1px solid #ddd;padding-top:15px;}
                </style>
                </head><body>
                    <div class="header">
                        <h1>📋 Relatório de Ponto Biométrico</h1>
                        <p>Emissão: ${new Date().toLocaleString('pt-BR')} | Total: ${registros.length} registros</p>
                    </div>
                    <table>
                        <thead><tr><th>Foto</th><th>Colaborador</th><th>Matrícula</th><th>Data/Hora</th></tr></thead>
                        <tbody>`;

                registros.reverse().forEach(p => {
                    html += `<tr>
                        <td><img src="${p.foto || 'data:image/svg+xml;utf8,<svg xmlns=%22http://w3.org%22 viewBox=%220 0 24 24%22 fill=%22%23475569%22><path d=%22M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5-4-8-4z%22/></svg>'}" class="photo-preview"></td>
                        <td><strong>${p.nome}</strong></td>
                        <td>${p.matricula || 'N/A'}</td>
                        <td>${p.horario}</td>
                    </tr>`;
                });

                html += `</tbody></table>
                    <div class="footer">Ponto Biométrico Seguro - Versão Funcional</div>
                </body></html>`;

                janela.document.write(html);
                janela.document.close();
                janela.onload = function() { janela.print(); };
                showToast('📄 PDF gerado!', 'success');
            };
        }

        // ============================================
        // INICIALIZAÇÃO
        // ============================================
        console.log('🔒 Ponto Biométrico - Versão Funcional');
        console.log('📌 Clique 3 vezes no "ADM" para abrir o painel');
        console.log('📸 Posicione o rosto na câmera para reconhecimento');
    </script>

</body>
